<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43c489"/>
      <stop offset="0.55" stop-color="#2e9d6b"/>
      <stop offset="1" stop-color="#1c6a49"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f5ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#d9a521"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2e9d6b"/>
      <stop offset="1" stop-color="#43c489"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0c3b28" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#glow)"/>
  <!-- decorative rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Antenna + coin -->
  <rect x="248" y="96" width="16" height="44" rx="8" fill="#eafaf0"/>
  <g filter="url(#soft)">
    <circle cx="256" cy="86" r="30" fill="url(#gold)" stroke="#b9851a" stroke-width="3"/>
  </g>
  <text x="256" y="97" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#7a560c" text-anchor="middle">Rp</text>

  <!-- Robot head -->
  <g filter="url(#soft)">
    <rect x="116" y="150" width="280" height="226" rx="56" fill="url(#head)"/>
  </g>
  <!-- side ears -->
  <rect x="98" y="220" width="26" height="80" rx="13" fill="#bdeccf"/>
  <rect x="388" y="220" width="26" height="80" rx="13" fill="#bdeccf"/>

  <!-- Eyes -->
  <circle cx="196" cy="226" r="26" fill="#1c6a49"/>
  <circle cx="316" cy="226" r="26" fill="#1c6a49"/>
  <circle cx="205" cy="217" r="8" fill="#ffffff"/>
  <circle cx="325" cy="217" r="8" fill="#ffffff"/>

  <!-- Chart "smile" screen -->
  <rect x="150" y="274" width="212" height="82" rx="20" fill="#eef9f2" stroke="#cfe9da" stroke-width="3"/>
  <rect x="172" y="318" width="26" height="24" rx="5" fill="url(#bar)"/>
  <rect x="212" y="300" width="26" height="42" rx="5" fill="url(#bar)"/>
  <rect x="252" y="296" width="26" height="46" rx="5" fill="url(#bar)"/>
  <!-- clean rising trend + arrowhead pointing up-right -->
  <path d="M178 332 L226 312 L296 288" fill="none" stroke="#d9a521" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M306 284 L286 290 L297 305 Z" fill="#d9a521"/>
</svg>
