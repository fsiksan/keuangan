<svg width="720" height="900" viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafaf1"/>
      <stop offset="1" stop-color="#cdeedd"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43c489"/>
      <stop offset="1" stop-color="#1f7a54"/>
    </linearGradient>
    <linearGradient id="mhead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f5ea"/>
    </linearGradient>
    <linearGradient id="mgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#d9a521"/>
    </linearGradient>
    <linearGradient id="mbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="msoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#114a32" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- soft circular backdrop -->
  <circle cx="360" cy="450" r="350" fill="url(#mbg)"/>

  <!-- shadow under mascot -->
  <ellipse cx="360" cy="812" rx="190" ry="34" fill="#114a32" fill-opacity="0.18"/>

  <!-- Legs -->
  <rect x="288" y="700" width="52" height="86" rx="26" fill="#1f7a54"/>
  <rect x="380" y="700" width="52" height="86" rx="26" fill="#1f7a54"/>
  <ellipse cx="314" cy="792" rx="42" ry="22" fill="#16603f"/>
  <ellipse cx="406" cy="792" rx="42" ry="22" fill="#16603f"/>

  <!-- Body -->
  <g filter="url(#msoft)">
    <rect x="226" y="468" width="268" height="262" rx="70" fill="url(#body)"/>
  </g>
  <!-- belly screen with rising chart -->
  <rect x="270" y="520" width="180" height="150" rx="26" fill="#0f5236" fill-opacity="0.92"/>
  <rect x="286" y="612" width="28" height="40" rx="6" fill="url(#mbar)"/>
  <rect x="324" y="586" width="28" height="66" rx="6" fill="url(#mbar)"/>
  <rect x="362" y="556" width="28" height="96" rx="6" fill="url(#mbar)"/>
  <path d="M300 600 L342 566 L380 540" fill="none" stroke="#ffd54f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 540 L384 536 L380 560 Z" fill="#ffd54f"/>

  <!-- Left arm (waving) -->
  <g filter="url(#msoft)">
    <rect x="150" y="470" width="58" height="150" rx="29" fill="#2e9d6b" transform="rotate(-28 179 545)"/>
  </g>
  <circle cx="142" cy="452" r="34" fill="#e3f5ea"/>

  <!-- Right arm holding coin -->
  <g filter="url(#msoft)">
    <rect x="512" y="500" width="58" height="140" rx="29" fill="#2e9d6b" transform="rotate(20 541 570)"/>
  </g>
  <g filter="url(#msoft)">
    <circle cx="585" cy="612" r="52" fill="url(#mgold)" stroke="#b9851a" stroke-width="5"/>
  </g>
  <circle cx="585" cy="612" r="40" fill="none" stroke="#b9851a" stroke-width="3" stroke-opacity="0.5"/>
  <text x="585" y="628" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#7a560c" text-anchor="middle">Rp</text>

  <!-- Antenna + coin -->
  <rect x="352" y="150" width="16" height="50" rx="8" fill="#1f7a54"/>
  <g filter="url(#msoft)">
    <circle cx="360" cy="138" r="32" fill="url(#mgold)" stroke="#b9851a" stroke-width="4"/>
  </g>
  <text x="360" y="150" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#7a560c" text-anchor="middle">Rp</text>

  <!-- Head -->
  <g filter="url(#msoft)">
    <rect x="214" y="196" width="292" height="248" rx="66" fill="url(#mhead)"/>
  </g>
  <!-- ears -->
  <rect x="194" y="276" width="28" height="92" rx="14" fill="#bdeccf"/>
  <rect x="498" y="276" width="28" height="92" rx="14" fill="#bdeccf"/>

  <!-- Eyes -->
  <circle cx="300" cy="296" r="32" fill="#1c6a49"/>
  <circle cx="420" cy="296" r="32" fill="#1c6a49"/>
  <circle cx="311" cy="285" r="10" fill="#ffffff"/>
  <circle cx="431" cy="285" r="10" fill="#ffffff"/>
  <!-- cheeks -->
  <circle cx="262" cy="356" r="17" fill="#7fd9a8" fill-opacity="0.6"/>
  <circle cx="458" cy="356" r="17" fill="#7fd9a8" fill-opacity="0.6"/>
  <!-- smile -->
  <path d="M300 360 Q360 410 420 360" fill="none" stroke="#1c6a49" stroke-width="10" stroke-linecap="round"/>
</svg>
